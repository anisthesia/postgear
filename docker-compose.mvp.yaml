# Personal-MVP infrastructure for postgear (Postiz fork).
# Only the backing services; the apps run from source with `pnpm dev`.
# Differences from docker-compose.dev.yaml:
#   - Redis on host port 6380 (6379 is taken by a local redis-server)
#   - Temporal UI on host port 8233 (8080 is taken by claude-broker)
#   - No Elasticsearch: Temporal uses SQL visibility (saves ~1 GB RAM)
#   - No pgAdmin / RedisInsight
# Usage: docker compose -f docker-compose.mvp.yaml up -d

services:
  postgear-postgres:
    image: postgres:17-alpine
    container_name: postgear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgear-local-pwd
      POSTGRES_USER: postgear-local
      POSTGRES_DB: postgear-db-local
    volumes:
      - postgear-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U postgear-local -d postgear-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  postgear-redis:
    image: redis:7-alpine
    container_name: postgear-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - postgear-redis:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: postgear-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - postgear-temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U temporal
      interval: 10s
      timeout: 3s
      retries: 3

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postgear-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - TEMPORAL_NAMESPACE=default
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: postgear-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  postgear-postgres:
  postgear-redis:
  postgear-temporal-postgres:
